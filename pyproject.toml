[project]
name = "submission-extraction-harness"
version = "0.1.0"
description = "Research harness measuring LLM extraction accuracy and run-to-run stability on synthetic commercial insurance submissions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "reportlab>=4.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "pillow>=10.2",
    "pypdfium2>=5.13.0",
    "pypdf>=6.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
all = [
    "submission-extraction-harness[dev,openai,anthropic]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/submission_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
